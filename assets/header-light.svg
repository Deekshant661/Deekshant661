<svg xmlns="http://www.w3.org/2000/svg" width="848" height="260" viewBox="0 0 848 260" role="img" aria-label="Deekshant Tilwani. I keep systems boring so products can be interesting.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .node rect { fill: #ffffff; stroke: #d0d7de; }
    .node text { fill: #1f2328; font-size: 12px; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .35 } }
    @keyframes blink { 50% { opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .pulse, .caret { animation: none } }
  </style>

  <rect x="0.5" y="0.5" width="847" height="259" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- left: identity -->
  <text x="40" y="58" class="mono" font-size="13" fill="#59636e">~/deekshant <tspan fill="#cf222e">(main)</tspan> $ whoami<tspan class="caret" fill="#1f2328">▍</tspan></text>
  <text x="38" y="112" class="sans" font-size="40" font-weight="600" fill="#1f2328" letter-spacing="-0.8">Deekshant Tilwani</text>
  <text x="40" y="146" class="sans" font-size="16" fill="#59636e">I keep systems boring so products can be interesting.</text>

  <g class="mono" font-size="12" fill="#59636e">
    <circle cx="44" cy="214" r="4" fill="#1a7f37" class="pulse"/>
    <text x="56" y="218">backups verified nightly</text>
    <text x="242" y="218">·  deploys pinned to a SHA</text>
    <text x="440" y="218">·  noida, in</text>
  </g>

  <!-- right: how code moves -->
  <g class="mono">
    <path d="M592 102 H624 M696 102 H728" stroke="#d0d7de" stroke-dasharray="3 4"/>
    <path d="M660 118 V148" stroke="#d0d7de" stroke-dasharray="3 4"/>
    <g class="node"><rect x="520" y="86" width="72" height="32" rx="4"/><text x="556" y="106" text-anchor="middle">laptop</text></g>
    <g class="node"><rect x="624" y="86" width="72" height="32" rx="4"/><text x="660" y="106" text-anchor="middle">gitlab</text></g>
    <g class="node"><rect x="728" y="86" width="72" height="32" rx="4"/><text x="764" y="106" text-anchor="middle">server</text></g>
    <g class="node"><rect x="624" y="148" width="72" height="32" rx="4"/><text x="660" y="168" text-anchor="middle">s3 · kms</text></g>

    <circle r="3" fill="#cf222e">
      <animateMotion dur="3.6s" repeatCount="indefinite" path="M592 102 H624 M696 102 H728" keyPoints="0;1" keyTimes="0;1"/>
    </circle>
    <circle r="3" fill="#1a7f37">
      <animateMotion dur="5s" begin="1.2s" repeatCount="indefinite" path="M660 118 V148"/>
    </circle>

    <text x="660" y="62" text-anchor="middle" font-size="11" fill="#59636e">push to git · servers pull · backups go down</text>
  </g>
</svg>
